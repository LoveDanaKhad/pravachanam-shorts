name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.0" }
          "VERSION = `"$v`"" | Out-File -Encoding utf8 pshorts\version.py
          "APPVER=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin

      - name: Build app
        run: >
          pyinstaller --noconfirm --noconsole --name PravachanamShorts --icon ui/app.ico
          --add-data "ui;ui" --add-data "fonts;fonts" --add-data "templates;templates"
          --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin"
          --collect-all onnx_asr --collect-all onnxruntime run.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:APPVER" installer\setup.iss

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/PravachanamShorts-Setup.exe

      - name: Keep installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PravachanamShorts-Setup
          path: Output/PravachanamShorts-Setup.exe
